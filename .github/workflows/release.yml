name: Release

# Runs when a version tag (v0.1.0, ...) is pushed. Publishes to PyPI with trusted publishing, so no
# API token is stored here; see docs/RELEASING.md for the one-time PyPI setup.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches bartmoss.__version__
        run: |
          version=$(python -c "import bartmoss; print(bartmoss.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match bartmoss.__version__ ($version)"; exit 1
          fi
      - name: Unit tests
        run: python -m unittest
      - name: Build sdist and wheel
        run: python -m pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Bartmoss $GITHUB_REF_NAME" --notes "See CHANGELOG.md for what's in this release."
